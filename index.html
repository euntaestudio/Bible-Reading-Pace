function render(){

function update(){
 document.querySelectorAll(".c").forEach(el=>el.setAttribute("aria-pressed",isOn(+el.dataset.b,+el.dataset.c)));
 for(let b=0;b<66;b++){const s=bookStat(b);
  document.getElementById("m"+b).textContent=`${s.ch}/${s.tc}`;
  document.getElementById("n"+b).textContent=tr("cnt",s.tc,fmt(s.tv));
  document.getElementById("d"+b).classList.toggle("done",s.ch===s.tc);
  document.querySelector(`[data-all="${b}"]`).textContent=s.ch===s.tc?tr("clearall"):tr("markall");}
 const o=range(0,OT),n=range(OT,66),T={ch:o.ch+n.ch,vs:o.vs+n.vs,tc:o.tc+n.tc,tv:o.tv+n.tv};
 const p=T.vs/T.tv*100,C=2*Math.PI*58;
 document.getElementById("arc").setAttribute("stroke-dasharray",`${C*p/100} ${C}`);
 document.getElementById("pct").textContent=(p>=10||p===0?p.toFixed(p===0?0:1):p.toFixed(1))+"%";
 document.getElementById("stats").innerHTML=`<div class="pc">${tr("st1",(o.vs/o.tv*100).toFixed(1),(n.vs/n.tv*100).toFixed(1))}</div><div class="cs">${tr("st2",T.ch,fmt(T.tc),fmt(T.vs),fmt(T.tv))}</div>`;
 document.getElementById("t0").textContent=tr("chn",o.ch,o.tc);

}

 else return;

const VERSES=[["시편 36:7","Psalm 36:7","How excellent is thy lovingkindness, O God! therefore the children of men put their trust under the shadow of thy wings.","하나님이여 주의 인자하심이 어찌 그리 보배로우신지요 인생이 주의 날개 그늘 아래 피하나이다"],["시편 36:5","Psalm 36:5","Thy mercy, O LORD, is in the heavens; and thy faithfulness reacheth unto the clouds.","여호와여 주의 인자하심이 하늘에 있고 주의 성실하심이 공중에 사무쳤으며"],["시편 57:10","Psalm 57:10","For thy mercy is great unto the heavens, and thy truth unto the clouds.","대저 주의 인자는 커서 하늘에 미치고 주의 진리는 궁창에 이르나이다"],["시편 63:3","Psalm 63:3","Because thy lovingkindness is better than life, my lips shall praise thee.","주의 인자가 생명보다 나으므로 내 입술이 주를 찬양할 것이라"],["시편 86:15","Psalm 86:15","But thou, O Lord, art a God full of compassion, and gracious, longsuffering, and plenteous in mercy and truth.","그러나 주여 주는 긍휼히 여기시며 은혜를 베푸시며 노하기를 더디 하시며 인자와 진실이 풍성하신 하나님이시오니"],["시편 100:5","Psalm 100:5","For the LORD is good; his mercy is everlasting; and his truth endureth to all generations.","대저 여호와는 선하시니 그 인자하심이 영원하고 그 성실하심이 대대로 미치리로다"],["시편 103:8","Psalm 103:8","The LORD is merciful and gracious, slow to anger, and plenteous in mercy.","여호와는 자비로우시며 은혜로우시며 노하기를 더디하시며 인자하심이 풍부하시도다"],["시편 103:11","Psalm 103:11","For as the heaven is high above the earth, so great is his mercy toward them that fear him.","이는 하늘이 땅에서 높음 같이 그를 경외하는 자에게 그 인자하심이 크심이로다"],["시편 107:1","Psalm 107:1","O give thanks unto the LORD, for he is good: for his mercy endureth for ever.","여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다"],["시편 108:4","Psalm 108:4","For thy mercy is great above the heavens: and thy truth reacheth unto the clouds.","대저 주의 인자하심이 하늘 위에 광대하시며 주의 진실은 궁창에 미치나이다"],["시편 118:1","Psalm 118:1","O give thanks unto the LORD; for he is good: because his mercy endureth for ever.","여호와께 감사하라 저는 선하시며 그 인자하심이 영원함이로다"],["시편 133:1","Psalm 133:1","Behold, how good and how pleasant it is for brethren to dwell together in unity!","형제가 연합하여 동거함이 어찌 그리 선하고 아름다운고"],["시편 136:1","Psalm 136:1","O give thanks unto the LORD; for he is good: for his mercy endureth for ever.","여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다"],["시편 145:8","Psalm 145:8","The LORD is gracious, and full of compassion; slow to anger, and of great mercy.","여호와는 은혜로우시며 자비하시며 노하기를 더디하시며 인자하심이 크시도다"],["시편 145:9","Psalm 145:9","The LORD is good to all: and his tender mercies are over all his works.","여호와께서는 만유를 선대하시며 그 지으신 모든 것에 긍휼을 베푸시는도다"],["시편 23:6","Psalm 23:6","Surely goodness and mercy shall follow me all the days of my life: and I will dwell in the house of the LORD for ever.","나의 평생에 선하심과 인자하심이 정녕 나를 따르리니 내가 여호와의 집에 영원히 거하리로다"],["잠언 8:17","Proverbs 8:17","I love them that love me; and those that seek me early shall find me.","나를 사랑하는 자들이 나의 사랑을 입으며 나를 간절히 찾는 자가 나를 만날 것이니라"],["잠언 10:12","Proverbs 10:12","Hatred stirreth up strifes: but love covereth all sins.","미움은 다툼을 일으켜도 사랑은 모든 허물을 가리우느니라"],["잠언 15:17","Proverbs 15:17","Better is a dinner of herbs where love is, than a stalled ox and hatred therewith.","여간 채소를 먹으며 서로 사랑하는 것이 살진 소를 먹으며 서로 미워하는 것보다 나으니라"],["잠언 16:24","Proverbs 16:24","Pleasant words are as an honeycomb, sweet to the soul, and health to the bones.","선한 말은 꿀송이 같아서 마음에 달고 뼈에 양약이 되느니라"],["잠언 17:9","Proverbs 17:9","He that covereth a transgression seeketh love; but he that repeateth a matter separateth very friends.","허물을 덮어 주는 자는 사랑을 구하는 자요 그것을 거듭 말하는 자는 친한 벗을 이간하는 자니라"],["잠언 17:17","Proverbs 17:17","A friend loveth at all times, and a brother is born for adversity.","친구는 사랑이 끊이지 아니하고 형제는 위급한 때까지 위하여 났느니라"],["잠언 18:24","Proverbs 18:24","A man that hath friends must shew himself friendly: and there is a friend that sticketh closer than a brother.","많은 친구를 얻는 자는 해를 당하게 되거니와 어떤 친구는 형제보다 친밀하니라"],["시편 23:1","Psalm 23:1","The LORD is my shepherd; I shall not want.","여호와는 나의 목자시니 내가 부족함이 없으리로다"],["시편 23:4","Psalm 23:4","Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me.","내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다"],["시편 34:18","Psalm 34:18","The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.","여호와는 마음이 상한 자에게 가까이 하시고 중심에 통회하는 자를 구원하시는도다"],["시편 46:1","Psalm 46:1","God is our refuge and strength, a very present help in trouble.","하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라"],["시편 55:22","Psalm 55:22","Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved.","네 짐을 여호와께 맡겨 버리라 너를 붙드시고 의인의 요동함을 영영히 허락지 아니하시리로다"],["시편 147:3","Psalm 147:3","He healeth the broken in heart, and bindeth up their wounds.","상심한 자를 고치시며 저희 상처를 싸매시는도다"],["이사야 41:10","Isaiah 41:10","Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.","두려워 말라 내가 너와 함께 함이니라 놀라지 말라 나는 네 하나님이 됨이니라 내가 너를 굳세게 하리라 참으로 너를 도와주리라 참으로 나의 의로운 오른손으로 너를 붙들리라"],["이사야 40:31","Isaiah 40:31","But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리의 날개치며 올라감 같을 것이요 달음박질하여도 곤비치 아니하겠고 걸어가도 피곤치 아니하리로다"],["마태복음 11:28","Matthew 11:28","Come unto me, all ye that labour and are heavy laden, and I will give you rest.","수고하고 무거운 짐진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라"],["고린도후서 1:4","2 Corinthians 1:4","Who comforteth us in all our tribulation, that we may be able to comfort them which are in any trouble, by the comfort wherewith we ourselves are comforted of God.","우리의 모든 환난 중에서 우리를 위로하사 우리로 하여금 하나님께 받는 위로로써 모든 환난 중에 있는 자들을 능히 위로하게 하시는 이시로다"],["시편 30:5","Psalm 30:5","For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning.","그 노염은 잠간이요 그 은총은 평생이로다 저녁에는 울음이 기숙할지라도 아침에는 기쁨이 오리로다"],["요한복음 14:27","John 14:27","Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것 같지 아니하니라 너희는 마음에 근심도 말고 두려워하지도 말라"],["요한복음 14:1","John 14:1","Let not your heart be troubled: ye believe in God, believe also in me.","너희는 마음에 근심하지 말라 하나님을 믿으니 또 나를 믿으라"],["이사야 43:2","Isaiah 43:2","When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee.","네가 물 가운데로 지날 때에 내가 함께할 것이라 강을 건널 때에 물이 너를 침몰치 못할 것이며 네가 불 가운데로 행할 때에 타지도 아니할 것이요 불꽃이 너를 사르지도 못하리니"],["시편 42:11","Psalm 42:11","Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.","내 영혼아 네가 어찌하여 낙망하며 어찌하여 내 속에서 불안하여 하는고 너는 하나님을 바라라 나는 내 얼굴을 도우시는 내 하나님을 오히려 찬송하리로다"],["요한계시록 21:4","Revelation 21:4","And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","모든 눈물을 그 눈에서 씻기시매 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라"],["베드로전서 5:7","1 Peter 5:7","Casting all your care upon him; for he careth for you.","너희 염려를 다 주께 맡겨 버리라 이는 저가 너희를 권고하심이니라"],["시편 91:1","Psalm 91:1","He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.","지존자의 은밀한 곳에 거하는 자는 전능하신 자의 그늘 아래 거하리로다"],["신명기 31:8","Deuteronomy 31:8","And the LORD, he it is that doth go before thee; he will be with thee, he will not fail thee, neither forsake thee: fear not, neither be dismayed.","여호와 그가 네 앞서 행하시며 너와 함께 하사 너를 떠나지 아니하시며 버리지 아니하시리니 너는 두려워 말라 놀라지 말라"],["여호수아 1:9","Joshua 1:9","Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.","내가 네게 명한 것이 아니냐 마음을 강하게 하고 담대히 하라 두려워 말며 놀라지 말라 네가 어디로 가든지 네 하나님 여호와가 너와 함께 하느니라 하시니라"],["스바냐 3:17","Zephaniah 3:17","The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.","너의 하나님 여호와가 너의 가운데 계시니 그는 구원을 베푸실 전능자시라 그가 너로 인하여 기쁨을 이기지 못하여 하시며 너를 잠잠히 사랑하시며 너로 인하여 즐거이 부르며 기뻐하시리라 하리라"],["시편 18:2","Psalm 18:2","The LORD is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, and my high tower.","여호와는 나의 반석이시요 나의 요새시요 나를 건지시는 자시요 나의 하나님이시요 나의 피할 바위시요 나의 방패시요 나의 구원의 뿔이시요 나의 산성이시로다"],["시편 27:1","Psalm 27:1","The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?","여호와는 나의 빛이요 나의 구원이시니 내가 누구를 두려워하리요 여호와는 내 생명의 능력이시니 내가 누구를 무서워하리요"],["시편 73:26","Psalm 73:26","My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.","내 육체와 마음은 쇠잔하나 하나님은 내 마음의 반석이시요 영원한 분깃이시라"],["시편 4:8","Psalm 4:8","I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.","내가 평안히 눕고 자기도 하리니 나를 안전히 거하게 하시는 이는 오직 여호와시니이다"],["요한복음 3:16","John 3:16","For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.","하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 저를 믿는 자마다 멸망치 않고 영생을 얻게 하려 하심이니라"],["요한복음 15:12","John 15:12","This is my commandment, That ye love one another, as I have loved you.","내 계명은 곧 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라 하는 이것이니라"],["요한복음 15:13","John 15:13","Greater love hath no man than this, that a man lay down his life for his friends.","사람이 친구를 위하여 자기 목숨을 버리면 이에서 더 큰 사랑이 없나니"],["로마서 5:8","Romans 5:8","But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.","우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에게 대한 자기의 사랑을 확증하셨느니라"],["고린도전서 13:13","1 Corinthians 13:13","And now abideth faith, hope, charity, these three; but the greatest of these is charity.","그런즉 믿음, 소망, 사랑, 이 세가지는 항상 있을 것인데 그 중에 제일은 사랑이라"],["요한일서 4:16","1 John 4:16","And we have known and believed the love that God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him.","하나님이 우리를 사랑하시는 사랑을 우리가 알고 믿었노니 하나님은 사랑이시라 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그 안에 거하시느니라"],["요한일서 4:18","1 John 4:18","There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love.","사랑 안에 두려움이 없고 온전한 사랑이 두려움을 내어 쫓나니 두려움에는 형벌이 있음이라 두려워하는 자는 사랑 안에서 온전히 이루지 못하였느니라"],["요한일서 4:19","1 John 4:19","We love him, because he first loved us.","우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라"],["예레미야 31:3","Jeremiah 31:3","The LORD hath appeared of old unto me, saying, Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee.","나 여호와가 옛적에 이스라엘에게 나타나 이르기를 내가 무궁한 사랑으로 너를 사랑하는 고로 인자함으로 너를 인도하였다 하였노라"],["로마서 13:10","Romans 13:10","Love worketh no ill to his neighbour: therefore love is the fulfilling of the law.","사랑은 이웃에게 악을 행치 아니하나니 그러므로 사랑은 율법의 완성이니라"],["베드로전서 4:8","1 Peter 4:8","And above all things have fervent charity among yourselves: for charity shall cover the multitude of sins.","무엇보다도 열심으로 서로 사랑할지니 사랑은 허다한 죄를 덮느니라"],["골로새서 3:14","Colossians 3:14","And above all these things put on charity, which is the bond of perfectness.","이 모든 것 위에 사랑을 더하라 이는 온전하게 매는 띠니라"],["요한복음 13:34","John 13:34","A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another.","새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라"],["이사야 54:10","Isaiah 54:10","For the mountains shall depart, and the hills be removed; but my kindness shall not depart from thee, neither shall the covenant of my peace be removed, saith the LORD that hath mercy on thee.","산들은 떠나며 작은 산들은 옮길지라도 나의 인자는 네게서 떠나지 아니하며 화평케 하는 나의 언약은 옮기지 아니하리라 너를 긍휼히 여기는 여호와의 말이니라"],["예레미야 29:11","Jeremiah 29:11","For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.","나 여호와가 말하노라 너희를 향한 나의 생각은 내가 아나니 재앙이 아니라 곧 평안이요 너희 장래에 소망을 주려하는 생각이라"],["로마서 15:13","Romans 15:13","Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.","소망의 하나님이 모든 기쁨과 평강을 믿음 안에서 너희에게 충만케 하사 성령의 능력으로 소망이 넘치게 하시기를 원하노라"],["로마서 8:28","Romans 8:28","And we know that all things work together for good to them that love God, to them who are the called according to his purpose.","우리가 알거니와 하나님을 사랑하는 자 곧 그 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라"],["로마서 5:5","Romans 5:5","And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.","소망이 부끄럽게 아니함은 우리에게 주신 성령으로 말미암아 하나님의 사랑이 우리 마음에 부은 바 됨이니"],["히브리서 11:1","Hebrews 11:1","Now faith is the substance of things hoped for, the evidence of things not seen.","믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니"],["시편 31:24","Psalm 31:24","Be of good courage, and he shall strengthen your heart, all ye that hope in the LORD.","강하고 담대하라 여호와를 바라는 너희들아"],["시편 39:7","Psalm 39:7","And now, Lord, what wait I for? my hope is in thee.","주여 내가 무엇을 바라리요 나의 소망은 주께 있나이다"],["고린도후서 4:16","2 Corinthians 4:16","For which cause we faint not; but though our outward man perish, yet the inward man is renewed day by day.","그러므로 우리가 낙심하지 아니하노니 겉 사람은 후패하나 우리의 속은 날로 새롭도다"],["고린도후서 4:18","2 Corinthians 4:18","While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.","우리의 돌아보는 것은 보이는 것이 아니요 보이지 않는 것이니 보이는 것은 잠간이요 보이지 않는 것은 영원함이니라"],["빌립보서 1:6","Philippians 1:6","Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ:","너희 속에 착한 일을 시작하신 이가 그리스도 예수의 날까지 이루실 줄을 우리가 확신하노라"],["시편 130:5","Psalm 130:5","I wait for the LORD, my soul doth wait, and in his word do I hope.","나 곧 내 영혼이 여호와를 기다리며 내가 그 말씀을 바라는도다"],["미가 7:7","Micah 7:7","Therefore I will look unto the LORD; I will wait for the God of my salvation: my God will hear me.","오직 나는 여호와를 우러러보며 나를 구원하시는 하나님을 바라보나니 하나님이 나를 들으시리로다"],["이사야 43:19","Isaiah 43:19","Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.","보라 내가 새 일을 행하리니 이제 나타낼 것이라 너희가 그것을 알지 못하겠느냐 정녕히 내가 광야에 길과 사막에 강을 내리니"],["빌립보서 4:13","Philippians 4:13","I can do all things through Christ which strengtheneth me.","내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라"],["빌립보서 4:19","Philippians 4:19","But my God shall supply all your need according to his riches in glory by Christ Jesus.","나의 하나님이 그리스도 예수 안에서 영광 가운데 그 풍성한 대로 너희 모든 쓸 것을 채우시리라"],["시편 118:24","Psalm 118:24","This is the day which the LORD hath made; we will rejoice and be glad in it.","이 날은 여호와의 정하신 것이라 이 날에 우리가 즐거워하고 기뻐하리로다"],["시편 37:4","Psalm 37:4","Delight thyself also in the LORD; and he shall give thee the desires of thine heart.","또 여호와를 기뻐하라 저가 네 마음의 소원을 이루어 주시리로다"],["잠언 16:9","Proverbs 16:9","A man’s heart deviseth his way: but the LORD directeth his steps.","사람이 마음으로 자기의 길을 계획할지라도 그 걸음을 인도하는 자는 여호와시니라"],["잠언 16:3","Proverbs 16:3","Commit thy works unto the LORD, and thy thoughts shall be established.","너의 행사를 여호와께 맡기라 그리하면 너의 경영하는 것이 이루리라"],["이사야 26:3","Isaiah 26:3","Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.","주께서 심지가 견고한 자를 평강에 평강으로 지키시리니 이는 그가 주를 의뢰함이니이다"],["마태복음 6:33","Matthew 6:33","But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.","너희는 먼저 그의 나라와 그의 의를 구하라 그리하면 이 모든 것을 너희에게 더하시리라"],["마태복음 6:34","Matthew 6:34","Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.","그러므로 내일 일을 위하여 염려하지 말라 내일 일은 내일 염려할 것이요 한 날 괴로움은 그 날에 족하니라"],["요한복음 16:33","John 16:33","These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.","이것을 너희에게 이름은 너희로 내 안에서 평안을 누리게 하려 함이라 세상에서는 너희가 환난을 당하나 담대하라 내가 세상을 이기었노라 하시니라"],["디모데후서 1:7","2 Timothy 1:7","For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.","하나님이 우리에게 주신 것은 두려워하는 마음이 아니요 오직 능력과 사랑과 근신하는 마음이니"],["히브리서 13:5","Hebrews 13:5","Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee.","돈을 사랑치 말고 있는 바를 족한 줄로 알라 그가 친히 말씀하시기를 내가 과연 너희를 버리지 아니하고 과연 너희를 떠나지 아니하리라 하셨느니라"],["야고보서 1:5","James 1:5","If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.","너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라"],["야고보서 1:17","James 1:17","Every good gift and every perfect gift is from above, and cometh down from the Father of lights, with whom is no variableness, neither shadow of turning.","각양 좋은 은사와 온전한 선물이 다 위로부터 빛들의 아버지께로서 내려오나니 그는 변함도 없으시고 회전하는 그림자도 없으시니라"],["시편 119:105","Psalm 119:105","Thy word is a lamp unto my feet, and a light unto my path.","주의 말씀은 내 발에 등이요 내 길에 빛이니이다"],["시편 9:10","Psalm 9:10","And they that know thy name will put their trust in thee: for thou, LORD, hast not forsaken them that seek thee.","여호와여 주의 이름을 아는 자는 주를 의지하오리니 이는 주를 찾는 자들을 버리지 아니하심이니이다"],["시편 100:4","Psalm 100:4","Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.","감사함으로 그 문에 들어가며 찬송함으로 그 궁정에 들어가서 그에게 감사하며 그 이름을 송축할지어다"],["마태복음 5:4","Matthew 5:4","Blessed are they that mourn: for they shall be comforted.","애통하는 자는 복이 있나니 저희가 위로를 받을 것임이요"],["마태복음 5:9","Matthew 5:9","Blessed are the peacemakers: for they shall be called the children of God.","화평케 하는 자는 복이 있나니 저희가 하나님의 아들이라 일컬음을 받을 것임이요"],["요한복음 8:12","John 8:12","Then spake Jesus again unto them, saying, I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life.","예수께서 또 일러 가라사대 나는 세상의 빛이니 나를 따르는 자는 어두움에 다니지 아니하고 생명의 빛을 얻으리라"],["갈라디아서 6:9","Galatians 6:9","And let us not be weary in well doing: for in due season we shall reap, if we faint not.","우리가 선을 행하되 낙심하지 말지니 피곤하지 아니하면 때가 이르매 거두리라"],["시편 51:10","Psalm 51:10","Create in me a clean heart, O God; and renew a right spirit within me.","하나님이여 내 속에 정한 마음을 창조하시고 내 안에 정직한 영을 새롭게 하소서"],["요한일서 1:9","1 John 1:9","If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.","만일 우리가 우리 죄를 자백하면 저는 미쁘시고 의로우사 우리 죄를 사하시며 모든 불의에서 우리를 깨끗케 하실 것이요"],["시편 16:11","Psalm 16:11","Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.","주께서 생명의 길로 내게 보이시리니 주의 앞에는 기쁨이 충만하고 주의 우편에는 영원한 즐거움이 있나이다"],["로마서 10:17","Romans 10:17","So then faith cometh by hearing, and hearing by the word of God.","그러므로 믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라"],["시편 126:5","Psalm 126:5","They that sow in tears shall reap in joy.","눈물을 흘리며 씨를 뿌리는 자는 기쁨으로 거두리로다"],["시편 62:5","Psalm 62:5","My soul, wait thou only upon God; for my expectation is from him.","나의 영혼아 잠잠히 하나님만 바라라 대저 나의 소망이 저로 좇아 나는도다"],["시편 94:19","Psalm 94:19","In the multitude of my thoughts within me thy comforts delight my soul.","내 속에 생각이 많을 때에 주의 위안이 내 영혼을 즐겁게 하시나이다"],["시편 29:11","Psalm 29:11","The LORD will give strength unto his people; the LORD will bless his people with peace.","여호와께서 자기 백성에게 힘을 주심이여 여호와께서 자기 백성에게 평강의 복을 주시리로다"],["시편 84:11","Psalm 84:11","For the LORD God is a sun and shield: the LORD will give grace and glory: no good thing will he withhold from them that walk uprightly.","여호와 하나님은 해요 방패시라 여호와께서 은혜와 영화를 주시며 정직히 행하는 자에게 좋은 것을 아끼지 아니하실 것임이니이다"],["이사야 40:29","Isaiah 40:29","He giveth power to the faint; and to them that have no might he increaseth strength.","피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니"],["이사야 40:8","Isaiah 40:8","The grass withereth, the flower fadeth: but the word of our God shall stand for ever.","풀은 마르고 꽃은 시드나 우리 하나님의 말씀은 영영히 서리라 하라"],["이사야 46:4","Isaiah 46:4","And even to your old age I am he; and even to hoar hairs will I carry you: I have made, and I will bear; even I will carry, and will deliver you.","너희가 노년에 이르기까지 내가 그리하겠고 백발이 되기까지 내가 너희를 품을 것이라 내가 지었은즉 안을 것이요 품을 것이요 구하여 내리라"],["시편 139:14","Psalm 139:14","I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.","내가 주께 감사하옴은 나를 지으심이 신묘막측하심이라 주의 행사가 기이함을 내 영혼이 잘 아나이다"],["시편 32:8","Psalm 32:8","I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.","내가 너의 갈 길을 가르쳐 보이고 너를 주목하여 훈계하리로다"],["시편 56:3","Psalm 56:3","What time I am afraid, I will trust in thee.","내가 두려워하는 날에는 주를 의지하리이다"],["시편 143:8","Psalm 143:8","Cause me to hear thy lovingkindness in the morning; for in thee do I trust: cause me to know the way wherein I should walk; for I lift up my soul unto thee.","아침에 나로 주의 인자한 말씀을 듣게 하소서 내가 주를 의뢰함이니이다 나의 다닐 길을 알게 하소서 내가 내 영혼을 주께 받듦이니이다"],["마태복음 28:20","Matthew 28:20","Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen.","내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라 볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라"],["고린도후서 12:9","2 Corinthians 12:9","And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.","내게 이르시기를 내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라 하신지라 이러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니 이는 그리스도의 능력으로 내게 머물게 하려 함이라"],["고린도후서 5:17","2 Corinthians 5:17","Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.","그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다"],["로마서 12:21","Romans 12:21","Be not overcome of evil, but overcome evil with good.","악에게 지지 말고 선으로 악을 이기라"],["히브리서 4:16","Hebrews 4:16","Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.","그러므로 우리가 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라"],["베드로전서 5:10","1 Peter 5:10","But the God of all grace, who hath called us unto his eternal glory by Christ Jesus, after that ye have suffered a while, make you perfect, stablish, strengthen, settle you.","모든 은혜의 하나님 곧 그리스도 안에서 너희를 부르사 자기의 영원한 영광에 들어가게 하신 이가 잠간 고난을 받은 너희를 친히 온전케 하시며 굳게 하시며 강하게 하시며 터를 견고케 하시리라"],["시편 37:7","Psalm 37:7","Rest in the LORD, and wait patiently for him: fret not thyself because of him who prospereth in his way, because of the man who bringeth wicked devices to pass.","여호와 앞에 잠잠하고 참아 기다리라 자기 길이 형통하며 악한 꾀를 이루는 자를 인하여 불평하여 말지어다"],["시편 25:4","Psalm 25:4","Shew me thy ways, O LORD; teach me thy paths.","여호와여 주의 도를 내게 보이시고 주의 길을 내게 가르치소서"],["시편 138:8","Psalm 138:8","The LORD will perfect that which concerneth me: thy mercy, O LORD, endureth for ever: forsake not the works of thine own hands.","여호와께서 내게 관계된 것을 완전케 하실지라 여호와여 주의 인자하심이 영원하오니 주의 손으로 지으신 것을 버리지 마옵소서"],["예레미야애가 3:24","Lamentations 3:24","The LORD is my portion, saith my soul; therefore will I hope in him.","내 심령에 이르기를 여호와는 나의 기업이시니 그러므로 내가 저를 바라리라 하도다"],["빌립보서 4:6-7","Philippians 4:6-7","Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.","아무 것도 염려하지 말고 오직 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라"],["예레미야애가 3:22-23","Lamentations 3:22-23","It is of the LORD’s mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness.","여호와의 자비와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다 이것이 아침마다 새로우니 주의 성실이 크도소이다"],["데살로니가전서 5:16-18","1 Thessalonians 5:16-18","Rejoice evermore. Pray without ceasing. In every thing give thanks: for this is the will of God in Christ Jesus concerning you.","항상 기뻐하라 쉬지 말고 기도하라 범사에 감사하라 이는 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라"],["잠언 3:5-6","Proverbs 3:5-6","Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.","너는 마음을 다하여 여호와를 의뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라"],["로마서 8:38-39","Romans 8:38-39","For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.","내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나 높음이나 깊음이나 다른 아무 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라"],["요한일서 4:7-8","1 John 4:7-8","Beloved, let us love one another: for love is of God; and every one that loveth is born of God, and knoweth God. He that loveth not knoweth not God; for God is love.","사랑하는 자들아 우리가 서로 사랑하자 사랑은 하나님께 속한 것이니 사랑하는 자마다 하나님께로 나서 하나님을 알고 사랑하지 아니하는 자는 하나님을 알지 못하나니 이는 하나님은 사랑이심이라"],["잠언 3:3-4","Proverbs 3:3-4","Let not mercy and truth forsake thee: bind them about thy neck; write them upon the table of thine heart: So shalt thou find favour and good understanding in the sight of God and man.","인자와 진리로 네게서 떠나지 않게 하고 그것을 네 목에 매며 네 마음판에 새기라 그리하면 네가 하나님과 사람 앞에서 은총과 귀중히 여김을 받으리라"],["마태복음 7:7-8","Matthew 7:7-8","Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you: For every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened.","구하라 그러면 너희에게 주실 것이요 찾으라 그러면 찾을 것이요 문을 두드리라 그러면 너희에게 열릴 것이니 구하는 이마다 얻을 것이요 찾는 이가 찾을 것이요 두드리는 이에게 열릴 것이니라"],["에베소서 2:8-9","Ephesians 2:8-9","For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast.","너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 얻었나니 이것이 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑치 못하게 함이니라"],["시편 121:1-2","Psalm 121:1-2","I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth.","내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬 나의 도움이 천지를 지으신 여호와에게서로다"],["시편 103:1-2","Psalm 103:1-2","Bless the LORD, O my soul: and all that is within me, bless his holy name. Bless the LORD, O my soul, and forget not all his benefits:","내 영혼아 여호와를 송축하라 내 속에 있는 것들아 다 그 성호를 송축하라 내 영혼아 여호와를 송축하며 그 모든 은택을 잊지 말지어다"],["고린도전서 13:4-7","1 Corinthians 13:4-7","Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up, Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil; Rejoiceth not in iniquity, but rejoiceth in the truth; Beareth all things, believeth all things, hopeth all things, endureth all things.","사랑은 오래 참고 사랑은 온유하며 투기하는 자가 되지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며 무례히 행치 아니하며 자기의 유익을 구치 아니하며 성내지 아니하며 악한 것을 생각지 아니하며 불의를 기뻐하지 아니하며 진리와 함께 기뻐하고 모든 것을 참으며 모든 것을 믿으며 모든 것을 바라며 모든 것을 견디느니라"],["갈라디아서 5:22-23","Galatians 5:22-23","But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law.","오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라"],["요한복음 11:25-26","John 11:25-26","Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live: And whosoever liveth and believeth in me shall never die. Believest thou this?","예수께서 가라사대 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고 무릇 살아서 나를 믿는 자는 영원히 죽지 아니하리니 이것을 네가 믿느냐"],["에베소서 3:20-21","Ephesians 3:20-21","Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us, Unto him be glory in the church by Christ Jesus throughout all ages, world without end. Amen.","우리 가운데서 역사하시는 능력대로 우리의 온갖 구하는 것이나 생각하는 것에 더 넘치도록 능히 하실 이에게 교회 안에서와 그리스도 예수 안에서 영광이 대대로 영원 무궁하기를 원하노라 아멘"],["시편 37:5-6","Psalm 37:5-6","Commit thy way unto the LORD; trust also in him; and he shall bring it to pass. And he shall bring forth thy righteousness as the light, and thy judgment as the noonday.","너의 길을 여호와께 맡기라 저를 의지하면 저가 이루시고 네 의를 빛 같이 나타내시며 네 공의를 정오의 빛 같이 하시리로다"]];

function fitDp(){
